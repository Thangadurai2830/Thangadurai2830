<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060a"/><stop offset="1" stop-color="#0b0d14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8925a"/><stop offset=".5" stop-color="#f3dfb4"/><stop offset="1" stop-color="#b8925a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d4b483" stop-opacity=".22"/><stop offset="1" stop-color="#d4b483" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <style>
      .t{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .name{font-size:68px;font-weight:300;letter-spacing:6px;fill:url(#gold);opacity:0;animation:up 1.2s .2s ease forwards}
      .role{font-size:15px;letter-spacing:7px;fill:#8b8f9c;opacity:0;animation:up 1.2s .6s ease forwards}
      .eye{font-size:12px;letter-spacing:6px;fill:#d4b483;opacity:0;animation:up 1s 0s ease forwards}
      .line{stroke:url(#gold);stroke-width:1;stroke-dasharray:240;stroke-dashoffset:240;animation:draw 1.4s .9s ease forwards}
      .orb{animation:float 8s ease-in-out infinite}
      @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-14px)}}
    </style>
  </defs>
  <rect width="1200" height="380" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="18" fill="url(#grid)"/>
  <g class="orb"><circle cx="600" cy="190" r="260" fill="url(#glow)"/></g>
  <rect x=".5" y=".5" width="1199" height="379" rx="18" fill="none" stroke="#d4b483" stroke-opacity=".18"/>
  <text x="600" y="120" text-anchor="middle" class="t eye">ZYNFOS · CHENNAI</text>
  <text x="600" y="200" text-anchor="middle" class="t name">THANGADURAI G</text>
  <line x1="480" y1="232" x2="720" y2="232" class="line"/>
  <text x="600" y="272" text-anchor="middle" class="t role">FULL STACK  ·  MOBILE  ·  AI / ML  ·  FOUNDER</text>
</svg>
